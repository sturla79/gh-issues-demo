<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Sample</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --primary: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            overflow: hidden;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -15px rgb(0 0 0 / 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e2937;
            color: #e2e8f0;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox input {
            width: auto;
            accent-color: var(--primary);
        }

        .forgot {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(37 99 235 / 0.3);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: #64748b;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .signup {
            text-align: center;
            font-size: 14px;
        }

        .signup a {
            color: #60a5fa;
            font-weight: 500;
            text-decoration: none;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid #34d399;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Acme</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email or username</label>
                <input type="text" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>

            <div class="options">
                <label class="checkbox">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign in
            </button>

            <div class="message" id="message"></div>

            <div class="divider">or</div>

            <div class="signup">
                Don't have an account? 
                <a href="#" onclick="alert('Sign-up page would open here in a real app!')">Sign up</a>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        // Toggle password visibility
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simple validation
            if (!emailInput.value.trim() || !passwordInput.value.trim()) {
                showMessage('Please fill in all fields', 'error');
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 400);
                return;
            }

            // Simulate loading
            loginBtn.textContent = 'Signing in...';
            loginBtn.disabled = true;

            // Fake API call (1.5 second delay)
            setTimeout(() => {
                showMessage('✅ Login successful! Welcome back!', 'success');
                
                // Reset button
                loginBtn.textContent = 'Sign in';
                loginBtn.disabled = false;

                // Reset form after 2 seconds (demo)
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                    form.reset();
                }, 2000);

            }, 1500);
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        // Bonus: Press Enter anywhere on the page to focus email
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'INPUT') {
                emailInput.focus();
            }
        });

        // Demo tip in console
        console.log('%c✅ Sample login page ready! Try submitting with any email & password.', 
                   'color: #3b82f6; font-family: monospace; font-size: 13px;');
    </script>
</body>
</html>
